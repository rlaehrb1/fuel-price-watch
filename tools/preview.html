<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>미리보기</title>
</head>
<body>
<script type="module">
  // Chrome 없이 팝업·설정 화면을 보는 개발용 틀. tools/sample.json을 저장소처럼 쓴다.
  // 사용: 이 폴더를 웹 서버로 열고 tools/preview.html?page=popup 또는 ?page=options
  const page = new URLSearchParams(location.search).get('page') === 'options' ? 'options' : 'popup';
  const store = await (await fetch('/tools/sample.json')).json();
  // ?demo=history: 표본 주유소로 최근 열흘치 가짜 변동 기록을 만든다(같은 결과가 나오도록 고정 난수).
  if (new URLSearchParams(location.search).get('demo') === 'history') makeDemoHistory(store);
  const listeners = [];

  function makeDemoHistory(store) {
    const { state, settings } = store;
    const HOUR = 3600e3;
    const DAY = 24 * HOUR;
    const KST = 9 * HOUR;
    const now = Date.now();
    const todayStart = Math.floor((now + KST) / DAY) * DAY - KST;
    let seed = 20261119;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = (list) => list[Math.floor(rand() * list.length)];
    const slots = [];
    for (let day = 0; day < 45; day += 1) {
      for (const hour of [19, 16, 12, 9, 2, 1]) {
        const at = todayStart - day * DAY + hour * HOUR + 10 * 60e3;
        if (at <= now) slots.push(at);
      }
    }
    const current = structuredClone(state.prices);
    const regular = settings.products.filter((prod) => current[prod]);
    const watched = [...(settings.watched || []), settings.station.id];
    const events = [];
    for (const at of slots) {
      if (rand() < 0.5) continue;
      const count = 1 + Math.floor(rand() * 4);
      for (let index = 0; index < count; index += 1) {
        const prod = rand() < 0.75 ? pick(regular.slice(0, 2)) : pick(Object.keys(current));
        const ids = Object.keys(current[prod]);
        const id = rand() < 0.5 ? pick(watched.filter((item) => item in current[prod])) || pick(ids) : pick(ids);
        const delta = (rand() < 0.45 ? 1 : -1) * pick([5, 10, 10, 10, 15, 20, 30]);
        const prods = [prod];
        if (regular.includes(prod) && rand() < 0.35) prods.push(regular.find((item) => item !== prod && id in current[item]));
        for (const item of prods.filter(Boolean)) {
          const to = current[item][id];
          if (to === undefined || events.some((event) => event.at === at && event.id === id && event.prod === item)) continue;
          current[item][id] = to - delta;
          events.push({ at, id, name: state.stations[id].name, prod: item, from: to - delta, to });
        }
      }
    }
    state.events = events;
    state.changes = {};
    for (const event of [...events].reverse()) {
      state.changes[event.prod] = { ...(state.changes[event.prod] || {}), [event.id]: { from: event.from, at: event.at } };
    }
    state.fetchedAt = slots[0];
    state.unseen = Math.min(3, events.filter((event) => watched.includes(event.id)).length);

    // 시 평균: 어제부터 90일 전까지, 제품마다 천천히 움직이는 값.
    const area = {};
    const level = Object.fromEntries(regular.map((prod) => [prod, state.average[prod] ? state.average[prod].price : 1800]));
    for (let day = 1; day <= 90; day += 1) {
      const date = new Date(todayStart - day * DAY + KST).toISOString().slice(0, 10);
      area[date] = {};
      for (const prod of regular) {
        level[prod] -= (rand() - 0.45) * 4;
        area[date][prod] = Math.round(level[prod] * 100) / 100;
      }
    }
    store.history = { days: {}, area, areaCode: settings.city.code, areaUpdatedOn: null, areaBackfillDone: true, areaTriedAt: 0 };

    // 반경 안 명단과 주유소 변화, 상세 정보(일부만 받은 상태).
    const nearIds = Object.entries(state.stations)
      .filter(([, station]) => station.dist !== null && station.dist <= 5000)
      .map(([id]) => id);
    state.roster = Object.fromEntries(nearIds.map((id) => [id, {
      name: state.stations[id].name, brand: state.stations[id].brand, firstSeen: now - 60 * DAY, lastSeen: slots[0]
    }]));
    state.rosterKey = [...regular].sort().join(',');
    const pickNear = (index) => nearIds[index % nearIds.length];
    const goneId = pickNear(17);
    state.roster[goneId].gone = todayStart - 9 * DAY + 9 * HOUR + 10 * 60e3;
    const stationEvent = (daysAgo, hour, id, kind, extra = {}) => ({
      at: todayStart - daysAgo * DAY + hour * HOUR + 10 * 60e3, id, name: state.stations[id].name, kind, ...extra
    });
    state.stationEvents = [
      stationEvent(0, 9, pickNear(23), 'new', { to: state.stations[pickNear(23)].brand }),
      stationEvent(2, 12, pickNear(8), 'brand', { from: state.stations[pickNear(8)].brand === 'SKE' ? 'GSC' : 'SKE', to: state.stations[pickNear(8)].brand }),
      stationEvent(9, 9, goneId, 'gone'),
      stationEvent(21, 16, pickNear(31), 'rename', { from: '(구)한빛주유소', to: state.stations[pickNear(31)].name })
    ];
    state.unseenStations = 2;
    const items = {};
    nearIds.forEach((id, index) => {
      if (index % 5 === 4) return;
      items[id] = {
        at: now - DAY, tel: `063-2${String(index).padStart(2, '0')}-${1000 + index * 37}`,
        wash: rand() < 0.6, cvs: rand() < 0.3, maint: rand() < 0.2, kpetro: rand() < 0.4,
        good: rand() < 0.15, good5: false, lpg: rand() < 0.1 ? 'C' : 'N', brand: state.stations[id].brand
      };
    });
    store.stationDetails = { items, calls: null };
  }
  window.chrome = {
    storage: {
      local: {
        async get(keys) {
          const names = Array.isArray(keys) ? keys : [keys];
          return Object.fromEntries(names.filter((key) => key in store).map((key) => [key, store[key]]));
        },
        async set(values) {
          Object.assign(store, values);
          for (const listener of listeners) listener({}, 'local');
        },
        async remove(keys) {
          for (const key of [].concat(keys)) delete store[key];
        }
      },
      onChanged: { addListener: (listener) => listeners.push(listener) }
    },
    runtime: {
      async sendMessage(message) {
        if (message.type === 'toggleWatch') {
          const watched = new Set(store.settings.watched || []);
          if (watched.has(message.id)) watched.delete(message.id); else watched.add(message.id);
          await window.chrome.storage.local.set({ settings: { ...store.settings, watched: [...watched] } });
          return { ok: true };
        }
        if (message.type === 'setPaused') {
          await window.chrome.storage.local.set({ paused: message.paused });
          return { ok: true, paused: message.paused };
        }
        if (message.type === 'refresh') return { ok: true, skipped: true, reason: '미리보기에서는 확인하지 않습니다.' };
        if (message.type === 'seenStations') {
          await window.chrome.storage.local.set({ state: { ...store.state, unseenStations: 0 } });
          return { ok: true };
        }
        if (message.type === 'listAreas') return { ok: true, areas: [{ code: '0601', name: '전주시' }, { code: '0606', name: '김제시' }, { code: '0621', name: '완주군' }] };
        return { ok: true, stations: [] };
      },
      getManifest() { return { version: 'preview' }; },
      openOptionsPage() { location.search = '?page=options'; }
    }
  };
  const html = await (await fetch(`/${page}.html`)).text();
  document.open();
  document.write(html.replace('<head>', '<head><base href="/">'));
  document.close();
</script>
</body>
</html>
