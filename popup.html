<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주유소 가격 감시</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="who">
      <h1 id="stationName">주유소 가격 감시</h1>
      <p class="status-line">
        <span id="autoStatus" class="auto-status"><span class="dot"></span><span id="autoText"></span></span>
        <span id="checkedAt" class="muted"></span>
      </p>
    </div>
    <button id="refresh" class="btn primary" type="button">지금 확인</button>
    <button id="pauseToggle" class="btn stop" type="button">조회중지</button>
    <button id="openOptions" class="btn ghost" type="button" title="설정" aria-label="설정">⚙</button>
  </header>

  <p id="notice" class="notice" hidden></p>

  <div id="viewSwitch" class="view-switch" role="tablist" aria-label="보기">
    <button type="button" role="tab" data-view="prices">가격표</button>
    <button type="button" role="tab" data-view="changes">가격 변동 <span id="changeBadge" class="count" hidden></span></button>
  </div>

  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="subTabs" class="seg" hidden></div>

  <div id="pricesView">
    <section id="summary" class="summary"></section>

    <div class="controls">
      <div class="seg" id="sortSeg">
        <button type="button" data-sort="price" class="on">가격순</button>
        <button type="button" data-sort="dist">거리순</button>
      </div>
      <div class="seg" id="filterSeg">
        <button type="button" data-filter="all" class="on">전체</button>
        <button type="button" data-filter="watched">감시만</button>
        <button type="button" data-filter="top" id="filterTop">최저 20</button>
      </div>
    </div>

    <div class="list-wrap">
      <table class="list">
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="muted empty" hidden>아직 받은 가격이 없습니다.</p>
    </div>
  </div>

  <div id="changesView" hidden>
    <section class="day-chart" aria-label="날짜별 변동 수">
      <div class="chart-head">
        <span><b>날짜별 변동</b> <span id="chartSpan" class="muted"></span></span>
        <span class="legend muted"><i class="up-key"></i>인상<i class="down-key"></i>인하</span>
      </div>
      <div id="dayCols" class="day-cols"></div>
    </section>

    <div class="controls">
      <div class="seg" id="scopeSeg">
        <button type="button" data-scope="all">전체</button>
        <button type="button" data-scope="watched">감시만</button>
      </div>
      <span id="changeTotals" class="totals"></span>
    </div>

    <div id="feedWrap" class="feed-wrap">
      <div id="feed"></div>
      <p id="feedEmpty" class="muted empty" hidden></p>
    </div>
  </div>

  <footer class="foot muted">
    <span id="calls"></span>
    <span>자료: 오피넷(한국석유공사)</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
